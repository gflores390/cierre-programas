<style>
    .reportes-container {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        align-items: center;
        width: 100%;
    }

    .btn-pdf {
        background-color: #f85a5a;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-family: 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-pdf:hover {
        background-color: #e04545;
    }

    .btn-pdf:active {
        transform: scale(0.98);
    }

    .pdf-icon {
        width: 16px;
        height: 16px;
        fill: currentColor;
    }
</style>

<div class="reportes-container">

</div>
