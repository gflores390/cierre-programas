<div class="flex flex-col gap-4 border-b border-gray-100 px-5 py-4 dark:border-white/[0.05] sm:px-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="relative w-full sm:max-w-xs">
      <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2">
        <svg
          class="fill-gray-500 dark:fill-gray-400"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M3.04199 9.37381C3.04199 5.87712 5.87735 3.04218 9.37533 3.04218C12.8733 3.04218 15.7087 5.87712 15.7087 9.37381C15.7087 12.8705 12.8733 15.7055 9.37533 15.7055C5.87735 15.7055 3.04199 12.8705 3.04199 9.37381ZM9.37533 1.54218C5.04926 1.54218 1.54199 5.04835 1.54199 9.37381C1.54199 13.6993 5.04926 17.2055 9.37533 17.2055C11.2676 17.2055 13.0032 16.5346 14.3572 15.4178L17.1773 18.2381C17.4702 18.531 17.945 18.5311 18.2379 18.2382C18.5308 17.9453 18.5309 17.4704 18.238 17.1775L15.4182 14.3575C16.5367 13.0035 17.2087 11.2671 17.2087 9.37381C17.2087 5.04835 13.7014 1.54218 9.37533 1.54218Z"
            fill=""
          />
        </svg>
      </span>
      <input
        type="text"
        placeholder="Buscar por estudiante, RUDE, curso o tutor..."
        [value]="busqueda()"
        (input)="onBusquedaInput($event)"
        class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent py-2.5 pl-11 pr-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
      />
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div class="w-32">
        <app-select
          label="Gestión"
          [options]="gestiones"
          [value]="gestion()"
          (valueChange)="gestionChange.emit($event)"
        />
      </div>

      <div class="w-44">
        <app-select
          label="Periodo"
          [options]="periodos"
          [value]="periodo()"
          (valueChange)="periodoChange.emit($event)"
        />
      </div>

      <app-button size="sm" variant="outline" (btnClick)="abrirFiltros.emit()">
        <svg class="fill-current" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 5.83333H17.5M5 10H15M8.33333 14.1667H11.6667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Filtros
      </app-button>

      <app-button size="sm" variant="outline" (btnClick)="exportar.emit()">
        <svg class="fill-current" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 13.3333V2.5M10 13.3333L6.66667 10M10 13.3333L13.3333 10M3.33333 14.1667V15.8333C3.33333 16.7538 4.07953 17.5 5 17.5H15C15.9205 17.5 16.6667 16.7538 16.6667 15.8333V14.1667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Exportar
      </app-button>

      <app-button size="sm" variant="primary" (btnClick)="nuevaMatricula.emit()">
        <svg class="fill-current" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 4.16667V15.8333M4.16667 10H15.8333" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Nueva Matrícula
      </app-button>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    @for (item of filtrosEstado; track item.valor) {
      <button
        type="button"
        (click)="estadoChange.emit(item.valor)"
        class="inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium transition"
        [class]="
          estado() === item.valor
            ? 'bg-brand-500 text-white shadow-theme-xs'
            : 'bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-white/[0.05] dark:text-gray-300 dark:hover:bg-white/[0.08]'
        "
      >
        {{ item.etiqueta }}
        <span
          class="rounded-full px-2 py-0.5 text-theme-xs font-semibold"
          [class]="
            estado() === item.valor
              ? 'bg-white/20 text-white'
              : 'bg-white text-gray-600 dark:bg-gray-900 dark:text-gray-400'
          "
        >
          {{ conteoPorEstado()[item.valor] }}
        </span>
      </button>
    }
  </div>
</div>
