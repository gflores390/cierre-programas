<app-data-table
  [rows]="matriculas()"
  [columns]="columns"
  [pageSize]="porPagina()"
  [pageIndex]="pageIndex()"
  [totalRows]="totalPaginas() * porPagina()"
  emptyMessage="No se encontraron matrículas con los filtros aplicados."
  (pageIndexChange)="onPageChange($event)"
>
  <ng-template appColumn="indice" [appColumnTypeOf]="matriculas()" let-_ let-i="index">
    <span class="text-gray-500 dark:text-gray-400">{{ indiceGlobal(i) }}</span>
  </ng-template>

  <ng-template appColumn="estudiante" [appColumnTypeOf]="matriculas()" let-row>
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 overflow-hidden rounded-full bg-gray-100 dark:bg-white/[0.05]">
        @if (row.estudiante.avatar) {
          <img
            width="40"
            height="40"
            [src]="row.estudiante.avatar"
            [alt]="row.estudiante.nombres"
          />
        }
      </div>
      <div>
        <span class="block font-medium text-gray-800 text-theme-sm dark:text-white/90">
          {{ row.estudiante.nombres }} {{ row.estudiante.apellidos }}
        </span>
        <span class="block text-gray-500 text-theme-xs dark:text-gray-400">
          {{ row.codigo }}
        </span>
      </div>
    </div>
  </ng-template>

  <ng-template appColumn="tutor" [appColumnTypeOf]="matriculas()" let-row>
    <span class="block text-gray-700 text-theme-sm dark:text-gray-300">
      {{ row.tutor.nombre }}
    </span>
    <span class="block text-gray-500 text-theme-xs dark:text-gray-400">
      {{ row.tutor.parentesco }}
    </span>
  </ng-template>

  <ng-template appColumn="contacto" [appColumnTypeOf]="matriculas()" let-row>
    <span class="block text-gray-700 text-theme-sm dark:text-gray-300">
      {{ row.contacto.telefono }}
    </span>
    @if (row.contacto.email) {
      <span class="block text-gray-500 text-theme-xs dark:text-gray-400">
        {{ row.contacto.email }}
      </span>
    }
  </ng-template>

  <ng-template appColumn="estado" [appColumnTypeOf]="matriculas()" let-row>
    <app-badge size="sm" [color]="colorEstado(row.estado)">
      {{ etiquetaEstado(row.estado) }}
    </app-badge>
  </ng-template>

  <ng-template appColumn="acciones" [appColumnTypeOf]="matriculas()" let-row>
    <div class="relative inline-block">
      <app-table-dropdown>
        <div dropdown-button>
          <button class="text-gray-500 dark:text-gray-400" aria-label="Acciones">
            <svg
              class="fill-current"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M5.99902 10.245C6.96552 10.245 7.74902 11.0285 7.74902 11.995V12.005C7.74902 12.9715 6.96552 13.755 5.99902 13.755C5.03253 13.755 4.24902 12.9715 4.24902 12.005V11.995C4.24902 11.0285 5.03253 10.245 5.99902 10.245ZM17.999 10.245C18.9655 10.245 19.749 11.0285 19.749 11.995V12.005C19.749 12.9715 18.9655 13.755 17.999 13.755C17.0325 13.755 16.249 12.9715 16.249 12.005V11.995C16.249 11.0285 17.0325 10.245 17.999 10.245ZM13.749 11.995C13.749 11.0285 12.9655 10.245 11.999 10.245C11.0325 10.245 10.249 11.0285 10.249 11.995V12.005C10.249 12.9715 11.0325 13.755 11.999 13.755C12.9655 13.755 13.749 12.9715 13.749 12.005V11.995Z"
              />
            </svg>
          </button>
        </div>
        <div dropdown-content>
          <button
            type="button"
            (click)="verDetalle.emit(row)"
            class="text-xs flex w-full rounded-lg px-3 py-2 text-left font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
          >
            Ver detalle
          </button>
          <button
            type="button"
            (click)="editar.emit(row)"
            class="text-xs flex w-full rounded-lg px-3 py-2 text-left font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
          >
            Editar
          </button>
          <button
            type="button"
            (click)="eliminar.emit(row)"
            class="text-xs flex w-full rounded-lg px-3 py-2 text-left font-medium text-error-500 hover:bg-error-50 dark:hover:bg-error-500/10"
          >
            Eliminar
          </button>
        </div>
      </app-table-dropdown>
    </div>
  </ng-template>
</app-data-table>
