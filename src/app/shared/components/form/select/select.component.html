<div class="relative" [class.opacity-60]="disabled()">
  <button
    type="button"
    [id]="id() || null"
    [disabled]="disabled()"
    (click)="onTriggerClick()"
    (keydown)="onKeydown($event)"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="'listbox'"
    class="peer flex w-full items-center justify-between rounded-lg border bg-transparent px-3.5 text-left text-sm shadow-theme-xs transition focus:outline-none disabled:cursor-not-allowed"
    [class]="
      triggerHeightClass() + ' ' + className() + ' ' +
      (open()
        ? 'border-brand-500 ring-3 ring-brand-500/10 text-gray-800 dark:text-white/90'
        : 'border-gray-300 hover:border-gray-400 dark:border-gray-700 dark:hover:border-gray-600 text-gray-800 dark:text-white/90')
    "
  >
    <span class="block flex-1 truncate">
      @if (selected(); as sel) {
        {{ sel.label }}
      } @else if (!label() && placeholder()) {
        <span class="text-gray-400 dark:text-gray-500">{{ placeholder() }}</span>
      } @else {
        &nbsp;
      }
    </span>
    <svg
      class="ml-2 size-4 shrink-0 text-gray-500 transition-transform duration-200 dark:text-gray-400"
      [class.rotate-180]="open()"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M5 7.5L10 12.5L15 7.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (label()) {
    <label
      [attr.for]="id() || null"
      class="pointer-events-none absolute left-3 bg-white px-1 transition-all duration-150 dark:bg-gray-900"
      [class]="
        showFloat()
          ? 'top-0 -translate-y-1/2 text-xs font-medium ' +
            (open() ? 'text-brand-500' : 'text-gray-500 dark:text-gray-400')
          : 'top-1/2 -translate-y-1/2 text-sm text-gray-500 dark:text-gray-400'
      "
    >
      {{ label() }}
    </label>
  }

  @if (open()) {
    <div
      class="absolute left-0 right-0 z-50 mt-1.5 overflow-hidden rounded-xl border border-gray-100 bg-white shadow-dropdown dark:border-gray-800 dark:bg-gray-900"
    >
      <ul role="listbox" class="max-h-60 overflow-y-auto py-1">
        @for (opt of options(); track opt.value; let i = $index) {
          <li
            role="option"
            [attr.aria-selected]="isSelected(opt)"
            [attr.aria-disabled]="opt.disabled || null"
            (click)="select(opt)"
            (mouseenter)="focusIndex.set(i)"
            class="mx-1 my-0.5 rounded-lg px-3 py-2 text-sm transition-colors"
            [class]="optionClass(opt, i)"
          >
            {{ opt.label }}
          </li>
        }
      </ul>
    </div>
  }
</div>
